$kind: http-request
description: Retrieves full information about a specific research run including nodes and evidence.
url: "{{baseUrl}}/api/v1/runs/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: Run ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Get run details by ID.resources/examples
order: 1000
