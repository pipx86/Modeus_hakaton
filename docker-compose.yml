name: activity-descriptor

# Local development stack:
#   docker compose up -d --build            -> demo api + web + postgres
#   docker compose --profile server up -d --build server web-server
#                                           -> full backend (cmd/server) + both
#                                              goose groups + built SPA/proxy
#   docker compose --profile monitoring up -d prometheus grafana jaeger
#   docker compose --profile automation up -d n8n n8n-postgres
#
# The default `api` service runs cmd/api: the in-memory store + deterministic
# chat fallback, so the demo works without goose migrations or an LLM provider.
# The `server` profile runs the real cmd/server backend (PostgreSQL store, JWT
# auth, goose-checked schema and optional LLM agents): the one-shot `migrate`
# service applies the main migrations, `migrate-vector` applies the optional
# vector group with its own version table, and only then does the backend start.
# `web-server` serves the built frontend and reverse-proxies /api/, /swagger/
# and /metrics to `server`, so the full stack has ONE public entry point (one
# port, same origin, no CORS). Runbook: README.md and migrations/README.md.
#
# Credentials come from the environment / .env / .secrets/llm.env (see
# .env.example). The fallbacks are local-development placeholders only; never
# use them in prod.
#
# Monitoring security posture (see docs/GRAFANA.md):
#   * Grafana anonymous access is DISABLED; the admin user/password come from
#     GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD (local fallback in this file).
#   * Grafana, Prometheus and Jaeger ports are published on 127.0.0.1 only.
#     Prometheus and Jaeger have no authentication of their own - do not expose
#     them beyond the host (production: TLS + auth reverse proxy / managed
#     observability, see docs/GRAFANA.md).
#   * Three Prometheus scrape configs are mounted and selected with
#     PROMETHEUS_CONFIG (PROMETHEUS_CONFIG=prometheus.host.yml for a backend on
#     the Docker host, PROMETHEUS_CONFIG=prometheus.server.yml for the compose
#     `server` profile), so the UI never lists an expected-DOWN api:8080 target.
#     The default prometheus.yml scrapes the demo compose `api` service.

# Goose и cmd/server используют pgx. Передаём реквизиты отдельно,
# чтобы пароль PostgreSQL мог содержать символы, зарезервированные в URI.
x-server-postgres: &server-postgres
  PGUSER: "${POSTGRES_USER:-activity}"
  PGPASSWORD: "${POSTGRES_PASSWORD:-activity_dev_password}"
  PGDATABASE: "${POSTGRES_DB:-activity_descriptor}"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: activity-descriptor-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: "${APP_ENV:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Demo API does not read DATABASE_URL (in-memory store); it is wired for
      # parity with cmd/server / production.
      DATABASE_URL: "${DATABASE_URL:-}"
      # Required for the JWT-protected /api/v1 endpoints; >= 32 bytes.
      JWT_SECRET: "${JWT_SECRET:-local-dev-jwt-secret-change-me-32-bytes-min}"
      # Optional: path to the OpenRouter key file inside the container.
      OPENROUTER_API_KEY_FILE: "${OPENROUTER_API_KEY_FILE:-}"
      # OpenTelemetry OTLP/HTTP tracing (see docs/OBSERVABILITY.md). An empty
      # endpoint keeps spans local; set it to http://jaeger:4318 to export to
      # the monitoring-profile collector. cmd/api (this service) does not call
      # observability.Setup yet; the production cmd/server does.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-}"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: activity-descriptor-web:local
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres:
    # pgvector image matches the backend migrations (vector extension).
    image: pgvector/pgvector:0.8.0-pg16
    # Host-only binding: the database is not a public demo surface.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-activity}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-activity_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-activity_descriptor}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- full backend profile ("server"): cmd/server + PostgreSQL migrations ---
  # One-shot goose runner: applies every pending migration from ./migrations
  # (goose's own version table makes a re-run a no-op). Exits non-zero on
  # failure; the `server` service waits for a successful exit, so the backend
  # never starts on a stale schema.
  migrate:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: activity-descriptor-migrate:local
    environment:
      <<: *server-postgres
      # goose reads DRIVER/DBSTRING/MIGRATION_DIR from the environment when no
      # positional arguments are passed. The compose-network DSN is the default;
      # SERVER_DATABASE_URL overrides it (external/host database, CI, tests).
      GOOSE_DRIVER: "postgres"
      GOOSE_DBSTRING: &server-database-url "${SERVER_DATABASE_URL:-postgres://postgres:5432?sslmode=disable}"
      GOOSE_MIGRATION_DIR: "/migrations"
    # Same host-gateway mapping as the monitoring profile, so
    # SERVER_DATABASE_URL=...@host.docker.internal:5432/... works on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Second one-shot goose runner: the optional vector/embedding migrations from
  # ./migrations/optional/vector, tracked in their OWN version table
  # (goose_vector_versions) so the main goose history stays independent. They run
  # after the main group because the SQL references tables created there
  # (sources, run_sources) and they need the pgvector extension. Idempotent like
  # `migrate`; a non-zero exit blocks the backend, so cmd/server never starts
  # against an incomplete vector schema.
  migrate-vector:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: activity-descriptor-migrate:local
    environment:
      <<: *server-postgres
      GOOSE_DRIVER: "postgres"
      GOOSE_DBSTRING: *server-database-url
      GOOSE_MIGRATION_DIR: "/migrations/optional/vector"
    # Global goose flags must precede the `up` command; -table/-dir override the
    # GOOSE_MIGRATION_DIR default of the image so the separate history is used.
    command: ["-table", "goose_vector_versions", "-dir", "/migrations/optional/vector", "up"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Production-shaped backend: cmd/server against PostgreSQL. Enable the full
  # stack with
  #   docker compose --profile server up -d --build server web-server
  # and stop it with
  #   docker compose --profile server stop server web-server
  # It never runs in the default `docker compose up` stack (the demo api does).
  server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: activity-descriptor-server:local
    ports:
      # Host port only: the demo api owns 8080 and the web placeholder 8081.
      # Override with SERVER_PORT in .env or the shell.
      - "${SERVER_PORT:-8082}:8080"
    # Secrets and provider settings are supplied by git-ignored local files when
    # they exist (both entries are optional, so `docker compose config` passes
    # in CI where neither file is checked out):
    #   .env               -> HH_* creds, JWT_SECRET/LLM_* when kept there
    #   .secrets/llm.env   -> JWT_SECRET, LLM_* provider/agent settings
    # Shell-exported variables are forwarded only where this file interpolates
    # them (SERVER_PORT, SERVER_DATABASE_URL, APP_ENV, LOG_LEVEL, POSTGRES_*).
    env_file:
      - path: .env
        required: false
      - path: .secrets/llm.env
        required: false
    environment:
      <<: *server-postgres
      HTTP_ADDR: ":8080"
      APP_ENV: "${APP_ENV:-local}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Keep the container on the compose-network PostgreSQL by default. Set
      # SERVER_DATABASE_URL to point at an external database (a host
      # `localhost` DSN is not reachable from inside the container).
      DATABASE_URL: *server-database-url
      # Container-context tracing endpoint. The host values in
      # .secrets/llm.env point at 127.0.0.1 (the Docker host), which is the
      # container itself; export to the monitoring-profile collector with
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 instead. Empty keeps
      # spans local (no export).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-}"
    # Resolves host.docker.internal on Linux Docker Engine too, so the full
    # backend can point SERVER_DATABASE_URL at a PostgreSQL on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Distroless image + static probe: GET /api/v1/health, exit 0 on 2xx.
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-vector:
        condition: service_completed_successfully
    restart: unless-stopped

  # One public entry point for the full stack: nginx serves the production
  # frontend build (frontend/dist baked into the `web` image target) and
  # reverse-proxies /api/, /swagger/ and /metrics to `server`, so the UI, the
  # versioned API and Swagger share one origin/port and no CORS is involved.
  # The demo `web` service (placeholder page + `api` proxy) is untouched and only
  # runs in the default stack.
  web-server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: activity-descriptor-web:local
    ports:
      # Single public port for the full stack. 8080/8081 belong to the demo
      # stack, 8082 is the backend's direct port; override with SERVER_WEB_PORT.
      - "${SERVER_WEB_PORT:-8083}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships BusyBox wget; /healthz is served by nginx itself.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    # Host-only binding: Prometheus has no auth/TLS of its own.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # PROMETHEUS_CONFIG picks the scrape config inside the mounted directory:
    #   prometheus.yml        -> compose `api` service (default)
    #   prometheus.host.yml   -> backend running on the Docker host (local demo)
    #   prometheus.server.yml -> compose `server` profile (full backend + SPA)
    # For host/server modes start Prometheus with `--no-deps` (see the header):
    # this service depends on the demo `api`, which must not be started next to
    # the full backend or the host backend (both want host port 8080).
    command:
      - "--config.file=/etc/prometheus/${PROMETHEUS_CONFIG:-prometheus.yml}"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # Resolves host.docker.internal on Linux Docker Engine too (Docker Desktop
    # already provides it); harmless when the compose `api` config is used.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    # Host-only binding. Anonymous access is disabled below, so a browser always
    # gets the login page; credentials are environment-based.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Local fallback only. Set GRAFANA_ADMIN_PASSWORD (e.g. in .env) to a
      # non-default secret for any shared/demo deployment; production injects
      # it from a secret manager.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin_dev_password}"
      GF_AUTH_BASIC_ENABLED: "true"
      # No anonymous access: every request must authenticate.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_started

  # OTLP trace collector + UI for the OpenTelemetry spans exported by the
  # backend. Enable it with the monitoring profile:
  #   docker compose --profile monitoring up -d jaeger
  # UI http://localhost:16686, OTLP/HTTP http://localhost:4318 (in-network:
  # http://jaeger:4318). See docs/OBSERVABILITY.md. Host-only binding: Jaeger
  # has no auth of its own and stores traces in memory (demo only).
  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:16686/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  n8n:
    image: n8nio/n8n:1.63.4
    profiles: ["automation"]
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-n8n_dev_password}"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "n8n-postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${N8N_DB_NAME:-n8n}"
      DB_POSTGRESDB_USER: "${N8N_DB_USER:-n8n}"
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD:-n8n_dev_password}"
      # Used by deploy/n8n/workflows/nightly_ingestion.json.
      INGESTION_URL: "${INGESTION_URL:-http://api:8080/api/v1/ingest}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      # Used by deploy/n8n/workflows/notion_email_notifications.json.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_TO: "${MAIL_TO:-}"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./deploy/n8n/workflows:/workflows:ro
    depends_on:
      n8n-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  n8n-postgres:
    image: postgres:16-alpine
    profiles: ["automation"]
    environment:
      POSTGRES_USER: "${N8N_DB_USER:-n8n}"
      POSTGRES_PASSWORD: "${N8N_DB_PASSWORD:-n8n_dev_password}"
      POSTGRES_DB: "${N8N_DB_NAME:-n8n}"
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  n8n_data:
  n8n_pgdata:
