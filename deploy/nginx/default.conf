server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy the versioned API to the api service so the placeholder page can
    # demonstrate the full request path (nginx -> api).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convenience proxy for local metric inspection through the web port.
    location = /metrics {
        proxy_pass http://api:8080/metrics;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
