# nginx configuration for the full-stack `web-server` compose service
# (Dockerfile target `web`, compose profile `server`).
#
# One public origin for everything: the built React SPA (frontend/dist) is
# served from this container while /api/, /swagger/ and /metrics are proxied to
# the compose `server` service (cmd/server on :8080 inside the compose network).
# The browser uses relative URLs (/api/v1/..., /metrics), so the API is
# same-origin: no CORS configuration and no second host port are needed.
#
# The demo `web` service keeps deploy/nginx/default.conf (placeholder page +
# `api` proxy); this file is only used by the `web-server` image built from the
# `web` Dockerfile stage.
server {
    listen 80;
    server_name _;

    # Docker DNS обновляет адрес при пересоздании контейнера server.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $modeus_backend http://server:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck. Served by nginx itself, so the web container is
    # healthy independently of backend startup.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API: /api/v1/... -> cmd/server. proxy_pass without a URI keeps
    # the original path (/api/v1/health -> http://server:8080/api/v1/health).
    #
    # proxy_buffering off is required for the SSE endpoint
    # (/api/v1/runs/{id}/events); the long timeouts cover chat/analysis calls
    # that stream for minutes.
    location /api/ {
        proxy_pass $modeus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 25m;
    }

    # Swagger UI + OpenAPI spec are served by cmd/server from /app/docs
    # (GET /swagger/ and GET /swagger/swagger.json); proxy them so both are
    # reachable through the single public port. Go's ServeMux redirects
    # /swagger to /swagger/.
    location = /swagger {
        proxy_pass $modeus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass $modeus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus exposition through the same origin for admin/debug convenience
    # (the full stack scrapes the backend directly; in production restrict this
    # endpoint, see docs/DOCKER_SERVER.md).
    location = /metrics {
        proxy_pass $modeus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed assets under /assets: cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
