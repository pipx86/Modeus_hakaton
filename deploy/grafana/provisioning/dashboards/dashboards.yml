# Grafana dashboard provisioning: everything in /var/lib/grafana/dashboards is
# loaded every 30s. The host directory is bind-mounted in docker-compose.yml.
apiVersion: 1

providers:
  - name: activity-descriptor
    orgId: 1
    folder: Activity Descriptor
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
