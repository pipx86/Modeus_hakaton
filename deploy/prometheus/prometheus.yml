# Prometheus configuration for the local compose stack (monitoring profile).
# The api service exposes the stdlib exposition on /metrics at :8080.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: activity-descriptor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
