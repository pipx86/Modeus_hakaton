# Prometheus configuration for the local compose stack (monitoring profile).
#
# The API exposes the stdlib Prometheus exposition on /metrics at :8080. There
# are two ways to run it, so there are two scrape jobs:
#
#   activity-descriptor-api       -> api:8080 (the compose `api` service)
#   activity-descriptor-api-host  -> host.docker.internal:8080 (a backend
#                                    started on the Docker host, e.g.
#                                    `make run` / `go run ./cmd/server`)
#
# Usually exactly one of them is UP: the API runs either inside compose or on
# the host. Docker Desktop resolves host.docker.internal natively (verified on
# Windows); on Linux add `host.docker.internal:host-gateway` to the prometheus
# service and make the backend listen on 0.0.0.0, or delete the host job.
# Change the target below if the local API listens on another host/port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: activity-descriptor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          deployment: compose

  # Extra target for the local/demo backend that runs outside the compose
  # network (docs/GRAFANA.md explains when this job is the one that is UP).
  - job_name: activity-descriptor-api-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          deployment: host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
