# Prometheus configuration: API inside the compose network (default).
#
# Use this file when the monitoring profile runs together with the compose
# `api` service:
#
#   docker compose --profile monitoring up -d --build api prometheus grafana jaeger
#
# The host-demo variant (backend started on the Docker host with `make run` /
# `go run ./cmd/server`) is deploy/prometheus/prometheus.host.yml; selecting it
# replaces THIS file, so the demo never contains a dead `api:8080` target:
#
#   PROMETHEUS_CONFIG=prometheus.host.yml \
#     docker compose --profile monitoring up -d --no-deps prometheus grafana jaeger
#
# Both files are mounted from this directory into /etc/prometheus; only the one
# named by PROMETHEUS_CONFIG is loaded (see docker-compose.yml).
#
# There is deliberately no cross-scraping between the two modes: a target that
# cannot be scraped is either absent from the config or the service it belongs
# to is a compose dependency, so the UI never shows an expected-DOWN target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The compose `api` service. Prometheus `depends_on` api: service_healthy in
  # docker-compose.yml, so this target only runs once the API is healthy.
  - job_name: activity-descriptor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          deployment: compose

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
