name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.26.10"

jobs:
  lint:
    name: lint (gofmt, vet, golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "gofmt required for:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: build
        run: go build ./...
      - name: test (race)
        run: go test -race -count=1 ./...

  coverage:
    name: coverage (AI core + overall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: overall coverage
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total < 50) { print "overall coverage below 50%: " total; exit 1 } }'
      - name: AI core coverage
        run: |
          go test -count=1 -coverprofile=coverage-ai.out ./internal/agent/... ./internal/chat/... ./internal/llm/... ./internal/prompts/... ./internal/steps/...
          go tool cover -func=coverage-ai.out | tail -1
          ai="$(go tool cover -func=coverage-ai.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v ai="$ai" 'BEGIN { if (ai < 75) { print "AI core coverage below 75%: " ai; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage-ai.out
          if-no-files-found: error

  e2e:
    name: offline pipeline e2e (fake model, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: run e2e
        run: go run ./cmd/e2e -out e2e-output.json
      - name: assert non-empty output
        run: test -s e2e-output.json
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.json
          if-no-files-found: error

  db-integration:
    name: db migrations (Postgres + goose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acceptance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/acceptance?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # Migrations live in the DB workstream branch. The checkout is
      # best-effort: this branch must stay green before the DB branch merges.
      - name: fetch migrations branch (best effort)
        id: migrations
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: feature/rustam/goose-migrations
          path: .ci-db

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: apply migrations (when available)
        run: |
          if [ -d .ci-db/migrations ]; then
            goose -dir .ci-db/migrations postgres "$DATABASE_URL" up
            if [ -d .ci-db/migrations_optional/vector ]; then
              goose -table goose_vector_versions -dir .ci-db/migrations_optional/vector postgres "$DATABASE_URL" up
            fi
          elif [ -d migrations ]; then
            goose -dir migrations postgres "$DATABASE_URL" up
          else
            echo "::warning::migrations not available on this branch; goose skipped (backend-acceptance.yml owns full DB acceptance)."
          fi

      - name: schema assertion (when migrations applied)
        run: |
          if [ -d .ci-db/migrations ] || [ -d migrations ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "SELECT to_regclass('public.runs') IS NOT NULL AS runs_exists;"
          fi

      - name: tests with database environment
        run: go test -count=1 ./...

  deploy-config:
    name: deploy config (compose, Grafana, Prometheus, n8n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate deploy assets
        run: python3 scripts/check_deploy.py
      - name: compose config (default + all profiles)
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile monitoring --profile automation config --quiet
      - name: required deliverables exist
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f docker-compose.yml
          test -f deploy/nginx/default.conf
          test -f deploy/n8n/workflows/nightly_ingestion.json
          test -f internal/metrics/metrics.go
          test -f cmd/api/main.go
          test -f docs/DOCKER.md
          test -f docs/GRAFANA.md
          test -f docs/METRICS.md
          test -f docs/N8N.md
          test -f docs/CI.md
          grep -q "100 MB" docs/DOCKER.md

  frontend:
    name: frontend (only if frontend/ exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json on this branch; frontend job skipped."
          fi
      - if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.exists == 'true'
        name: install and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

  docker:
    name: docker image (<100MB) + container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build API image
        run: docker build -t activity-descriptor-api:local .
      - name: assert image size below 100 MB
        run: |
          size="$(docker image inspect activity-descriptor-api:local --format '{{.Size}}')"
          echo "image size: ${size} bytes"
          test "${size}" -lt 104857600
      - name: container smoke (health, metrics, JWT chat)
        run: |
          docker run -d --name api-smoke -p 18080:8080 \
            -e JWT_SECRET=ci-demo-jwt-secret-at-least-32-bytes-long \
            activity-descriptor-api:local
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/metrics | grep -q activity_descriptor
          curl -fsS http://127.0.0.1:18080/api/v1/health
          docker exec api-smoke /api -healthcheck
          token="$(docker exec api-smoke /local-token -role admin)"
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/runs \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            -d '{"profession":"analyst"}' | grep -q '"id"'
          sleep 1
          curl -fsS http://127.0.0.1:18080/api/v1/runs/run-1/messages \
            -H "Authorization: Bearer ${token}" | grep -q agent
          docker stop api-smoke
          docker rm api-smoke
