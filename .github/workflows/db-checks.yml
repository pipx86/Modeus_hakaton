name: Проверка хранения данных

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  db-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: dbtest
          POSTGRES_DB: dbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:dbtest@127.0.0.1:5432/dbtest?sslmode=disable
    steps:
      - name: Получить код
        uses: actions/checkout@v6
      - name: Установить Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Установить Goose и sqlc
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Применить миграции
        run: |
          goose -dir migrations postgres "$DATABASE_URL" up
          goose -table goose_vector_versions -dir migrations/optional/vector postgres "$DATABASE_URL" up
      - name: Проверить генерацию sqlc
        run: |
          sqlc generate
          git diff --exit-code -- internal/store/db
      - name: Проверить хранение и поиск
        env:
          STORE_TEST_DATABASE_URL: postgres://postgres:dbtest@127.0.0.1:5432/dbtest?sslmode=disable
          VECTOR_TEST_DATABASE_URL: postgres://postgres:dbtest@127.0.0.1:5432/dbtest?sslmode=disable
          OUTBOX_TEST_DATABASE_URL: postgres://postgres:dbtest@127.0.0.1:5432/dbtest?sslmode=disable
        run: make db-coverage
      - name: Проверить минимальное покрытие логики БД
        run: |
          coverage="$(go tool cover -func=coverage-db.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 70) exit 1 }'
      - name: Дважды создать демонстрационные данные
        run: |
          make seed
          make seed
      - name: Проверить качество данных
        run: make check-data
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: db-quality-report
          path: data/reports/
          if-no-files-found: ignore
