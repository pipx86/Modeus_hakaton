  /runs/{id}/search:
    get:
      tags:
      - runs
      summary: Search fragments in the run's sources
      description: Vector search by default; `strategy=hybrid` combines vector and
        BM25 hits. Requires the PostgreSQL store and a configured embedding model.
      operationId: searchRunFragments
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: q
        in: query
        required: true
        description: Search query.
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: Maximum number of hits, 1..100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
      - name: strategy
        in: query
        required: false
        description: Search strategy; `vector` by default.
        schema:
          type: string
          enum:
          - vector
          - hybrid
          default: vector
      responses:
        '200':
          description: Search mode and the found fragments.
          content:
            application/json:
              schema:
                type: object
                required:
                - mode
                - hits
                properties:
                  mode:
                    type: string
                    enum:
                    - vector
                    - bm25
                    - hybrid
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        ref_id:
                          type: string
                          format: uuid
                        source_id:
                          type: string
                          format: uuid
                        quote:
                          type: string
                        score:
                          type: number
                        node_id:
                          type: string
                          format: uuid
                          description: Tree node matched by the quote when it can
                            be resolved.
        '400':
          description: Invalid query, strategy, limit or a failed search request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: limit must be between 1 and 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/snapshots:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - runs
      summary: List run snapshots
      description: Snapshots ordered by version. Requires the PostgreSQL store.
      operationId: listSnapshots
      responses:
        '200':
          description: Snapshots in version order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags:
      - runs
      summary: Create a snapshot of the saved tree
      description: Captures the currently saved activity tree as the next snapshot
        version.
      operationId: createSnapshot
      responses:
        '201':
          description: Snapshot created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run has no saved tree yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TREE_MISSING
                message: the run has no saved tree
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/snapshots/{snapshot_id}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    - $ref: '#/components/parameters/SnapshotId'
    get:
      tags:
      - runs
      summary: Get a run snapshot
      operationId: getSnapshot
      responses:
        '200':
          description: Stored snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/snapshots/{snapshot_id}/diff:
    parameters:
    - $ref: '#/components/parameters/RunId'
    - $ref: '#/components/parameters/SnapshotId'
    get:
      tags:
      - runs
      summary: Diff two snapshots of a run
      description: 'Compares the tree stored in the `against` snapshot (base) with
        the tree stored in the path snapshot (head). Both snapshots must belong to
        the run `{id}`. Nodes are matched by id; `added` and `removed` list whole
        nodes and `changed` lists nodes with the changed field names in the fixed
        order `title`, `description`, `type`, `parent_id`, `evidence`. Evidence order
        inside a node is not significant, an empty status is treated as `pending`,
        and every returned node carries its evidence (`source_id`, `ref_id`, `quote`,
        `status`) so the UI can jump to the original source quote. Equal snapshots
        produce an empty diff (all arrays empty, summary zeros, story says the trees
        are identical). `story` is a deterministic one-line Russian summary of the
        diff and `story_lines` is the same story line by line (header with counts,
        then one line per change, at most 20 detail lines followed by an "Ещё изменений:
        N." overflow line); the counts in both always agree with `summary`.'
      operationId: diffRunSnapshots
      parameters:
      - name: against
        in: query
        required: true
        description: Base snapshot id; the path snapshot is the head of the comparison.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Snapshot tree diff (added, removed, changed and summary counts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDiff'
              examples:
                oneAddedOneChanged:
                  summary: A node was added and another node was renamed
                  value:
                    run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                    base:
                      id: 0f1e2d3c-4b5a-6978-8a9b-0c1d2e3f4a5b
                      version: 1
                    head:
                      id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      version: 2
                    added:
                    - id: 7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c
                      type: action
                      title: Собирать требования еженедельно
                      parent_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                      evidence:
                      - id: e1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                        node_id: 7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c
                        source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                        ref_id: frag-12
                        quote: Каждую неделю я собираю требования у заказчика.
                        status: pending
                    removed: []
                    changed:
                    - id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                      before:
                        id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                        type: task
                        title: Собирать требования
                        evidence:
                        - id: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                          node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                          source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                          ref_id: frag-7
                          quote: Собираю требования у заказчика.
                          status: approved
                      after:
                        id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                        type: task
                        title: Собирать требования к интеграции
                        evidence:
                        - id: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                          node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                          source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                          ref_id: frag-7
                          quote: Собираю требования у заказчика.
                          status: approved
                      fields:
                      - title
                    summary:
                      added: 1
                      removed: 0
                      changed: 1
                    story: 'Узлов добавлено: 1, удалено: 0, изменено: 1. Добавлен
                      узел «Собирать требования еженедельно». Изменён узел «Собирать
                      требования к интеграции»: название.'
                    story_lines:
                    - 'Узлов добавлено: 1, удалено: 0, изменено: 1.'
                    - Добавлен узел «Собирать требования еженедельно».
                    - 'Изменён узел «Собирать требования к интеграции»: название.'
        '400':
          description: The against query parameter is missing or is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingAgainst:
                  summary: Missing base snapshot
                  value:
                    code: BAD_REQUEST
                    message: against parameter is required
                invalidAgainst:
                  summary: Base snapshot is not a UUID
                  value:
                    code: BAD_REQUEST
                    message: against must be a snapshot UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The run or either snapshot does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: run or snapshot not found
        '409':
          description: A snapshot exists but belongs to another run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SNAPSHOT_RUN_MISMATCH
                message: snapshot belongs to another run
        '500':
          description: A stored snapshot tree could not be parsed, or a database error
            occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                treeInvalid:
                  summary: Stored snapshot tree is corrupted
                  value:
                    code: SNAPSHOT_TREE_INVALID
                    message: unable to parse the snapshot tree
                internal:
                  summary: Other database or server error
                  value:
                    code: INTERNAL
                    message: unable to compare snapshots
        '501':
          $ref: '#/components/responses/NotImplemented'
  /nodes/{id}:
    patch:
      tags:
      - nodes
      summary: Edit a node (rename or describe)
      description: Updates title, description and/or the full evidence list of a node.
        Only these fields are applied; retyping or moving a node (type, parent_id)
        is not supported by the backend and such fields are ignored.
      operationId: patchNode
      parameters:
      - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                evidence:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Evidence'
            example:
              title: Собирать требования к интеграции
              description: Регулярно уточнять требования у заказчика.
      responses:
        '200':
          description: Updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableTree'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags:
      - auth
      summary: Register a user
      description: Creates an account with email and password. The first registered
        user becomes admin, all following users get the user role. Returns a 24-hour
        JWT.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - auth
      summary: Log in with email and password
      description: Returns a 24-hour JWT for an existing account.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; token and user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - users
      summary: List registered users
      description: Registered accounts with email, display name and role; available
        to the admin role only.
      operationId: listUsers
      responses:
        '200':
          description: Registered users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthUser'
              example:
              - id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                email: admin@example.com
                display_name: Администратор
                role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT with `sub` and `role` claims; roles are admin and user.
  parameters:
    RunId:
      name: id
      in: path
      required: true
      description: Run identifier (UUID with PostgreSQL; `run-<n>` with the in-memory
        demo store).
      schema:
        type: string
    SourceId:
      name: id
      in: path
      required: true
      description: Source identifier (UUID with PostgreSQL).
      schema:
        type: string
    EvidenceId:
      name: id
      in: path
      required: true
      description: Evidence identifier.
      schema:
        type: string
    NodeId:
      name: id
      in: path
      required: true
      description: Node identifier.
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: Snapshot identifier (UUID). The path snapshot is the head of a
        diff comparison.
      schema:
        type: string
        format: uuid
    EvidenceContextId:
      name: evidence_id
      in: path
      required: true
      description: Evidence identifier. It must belong to the run in the path; evidence
        of another run is indistinguishable from a missing one (404).
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body, path or query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: invalid JSON body
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: missing or invalid token
    Forbidden:
      description: The authenticated role is not allowed to call this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: insufficient permissions for this action
    NotFound:
      description: The requested run, snapshot, source, node or evidence does not
        exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: not found
    UnprocessableTree:
      description: Tree or evidence validation failed. `code` is a stable machine-readable
        value such as MISSING_EVIDENCE, INVALID_EVIDENCE, DUPLICATE_NODE_ID, DUPLICATE_SIBLING_TITLE,
        CYCLE_DETECTED, INVALID_TREE_DEPTH, ORPHAN_NODE or INVALID_REFERENCE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TreeValidationError'
          example:
            code: MISSING_EVIDENCE
            node_id: n1
            details: node must reference at least one evidence quote
    InternalError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL
            message: internal error
    NotImplemented:
      description: The configured store does not support this operation. The in-memory
        demo store returns this for PostgreSQL-only features.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_IMPLEMENTED
            message: requires PostgreSQL store
    ServiceUnavailable:
      description: The service or an upstream dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: service temporarily unavailable
    GatewayTimeout:
      description: The upstream operation timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: GATEWAY_TIMEOUT
            message: upstream timeout
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable message; may be localized.
    TreeValidationError:
      type: object
      required:
      - code
      - details
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable validation code (for example MISSING_EVIDENCE or INVALID_EVIDENCE).
        node_id:
          type: string
          description: Node the validation error points at, when known.
        details:
          type: string
          description: Human-readable validation details.
    NodeType:
      type: string
      enum:
      - role
      - function
      - task
      - action
    SourceType:
      type: string
      enum:
      - vacancy
      - interview
      - standard
      - document
    RunStatus:
      type: string
      enum:
      - pending
      - running
      - done
      - degraded
      - failed
    RunType:
      type: string
      enum:
      - batch
      - chat
      description: chat runs are driven by the interview chat; batch runs by the batch
        pipeline.
    EvidenceStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      description: Review state of an evidence quote. An empty status is treated as
        pending on legacy records.
    Evidence:
      type: object
      required:
      - id
      - source_id
      - quote
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        ref_id:
          type: string
          minLength: 1
          description: Anchor of the quoted fragment inside the source.
        quote:
          type: string
        status:
          $ref: '#/components/schemas/EvidenceStatus'
    EvidenceDetails:
      type: object
      description: Evidence plus the legacy `approved` flag.
      required:
      - id
      - source_id
      - quote
      - approved
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        ref_id:
          type: string
          minLength: 1
        quote:
          type: string
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        approved:
          type: boolean
          description: True when status is approved.
    Zun:
      type: object
      nullable: true
      description: Knowledge, skills and abilities attached to a tree node. In responses
        that carry an optional ZUN (for example a ZUN suggestion) the value is `null`
        when the node has no ZUN yet.
      additionalProperties: false
      properties:
        knowledge:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        abilities:
          type: array
          items:
            type: string
    Node:
      type: object
      required:
      - id
      - type
      - title
      - evidence
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/NodeType'
        title:
          type: string
          minLength: 1
        description:
          type: string
        parent_id:
          type: string
          description: Absent for the root node.
        zun:
          $ref: '#/components/schemas/Zun'
        evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Evidence'
    Source:
      type: object
      required:
      - id
      - type
      - title
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
          minLength: 1
        content:
          type: string
        source_url:
          type: string
        created_at:
          type: string
          format: date-time
    ExportNode:
      type: object
      description: One node of the flat `nodes` list of a JSON run export.
      required:
      - id
      - type
      - title
      - evidence
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/NodeType'
        title:
          type: string
          minLength: 1
        description:
          type: string
        parent_id:
          type: string
          description: Absent for the root node.
        zun:
          $ref: '#/components/schemas/Zun'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    ExportTreeNode:
      type: object
      description: Node of the nested `tree` of a JSON run export; children repeat
        the same shape.
      required:
      - id
      - type
      - title
      - evidence
      - children
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/NodeType'
        title:
          type: string
          minLength: 1
        description:
          type: string
        parent_id:
          type: string
