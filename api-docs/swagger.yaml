    ExportRun:
      type: object
      description: Structured JSON export of a completed run (`GET /runs/{id}/export?format=json`).
      required:
      - schema
      - generated_at
      - run
      - tree
      - nodes
      - evidence
      - conflicts
      - final_message
      additionalProperties: false
      properties:
        schema:
          type: string
          enum:
          - run-export/v1
          description: Export document schema version.
        generated_at:
          type: string
          format: date-time
          description: Time the export was generated (UTC).
        run:
          $ref: '#/components/schemas/Run'
        tree:
          type: array
          description: Nested role → function → task → action hierarchy.
          items:
            $ref: '#/components/schemas/ExportTreeNode'
        nodes:
          type: array
          description: Flat node list in storage order.
          items:
            $ref: '#/components/schemas/ExportNode'
        evidence:
          type: array
          description: All evidence quotes of the tree; `node_id` is always filled.
          items:
            $ref: '#/components/schemas/Evidence'
        conflicts:
          type: array
          description: Resolved synthesizer conflicts; empty when none or when the
            store cannot provide them.
          items:
            $ref: '#/components/schemas/Conflict'
        final_message:
          type: string
          description: Last agent chat message with recommendations/courses. Empty
            for batch runs and after a server restart because the chat session lives
            in memory.
        sources:
          type: array
          description: Metadata of sources linked to the run (best-effort, PostgreSQL
            only). The full source content is intentionally not exported.
          items:
            $ref: '#/components/schemas/Source'
      example:
        schema: run-export/v1
        generated_at: '2026-11-18T10:12:00Z'
        run:
          id: run-export-1
          status: done
          profession: Аналитик данных
          stage: done
          type: chat
        tree:
        - id: node-role
          type: role
          title: Аналитик данных
          evidence: []
          children: []
        nodes:
        - id: node-role
          type: role
          title: Аналитик данных
          evidence: []
        evidence: []
        conflicts: []
        final_message: 'Интервью завершено. Курсы Stepik: SQL с нуля'
