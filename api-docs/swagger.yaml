            at least 10 duration and 10 token samples; medium: at least 3 of both;
            low otherwise or when a default-based input is used).'
        method:
          type: string
          enum:
          - profession_history
          - partial_history
          - global_history
          - defaults
          description: Which inputs the estimate used.
