          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
    SnapshotDiff:
      type: object
      description: Response of GET /runs/{id}/snapshots/{snapshot_id}/diff?against={base_snapshot_id}.
      required:
      - run_id
      - base
      - head
      - added
      - removed
      - changed
      - summary
      - story
      - story_lines
      additionalProperties: false
      properties:
        run_id:
          type: string
          format: uuid
        base:
          $ref: '#/components/schemas/SnapshotVersionRef'
        head:
          $ref: '#/components/schemas/SnapshotVersionRef'
        added:
          type: array
          description: Nodes that exist only in head, sorted by id.
          items:
            $ref: '#/components/schemas/Node'
        removed:
          type: array
          description: Nodes that exist only in base, sorted by id.
          items:
            $ref: '#/components/schemas/Node'
        changed:
          type: array
          description: Nodes present in both snapshots whose fields changed, sorted
            by id.
          items:
            $ref: '#/components/schemas/SnapshotNodeChange'
        summary:
          $ref: '#/components/schemas/SnapshotDiffSummary'
        story:
          type: string
          description: 'Deterministic one-line human-readable description of the diff
            in Russian (header counts plus up to five details; long titles are truncated
            and a "Ещё изменений: N." suffix reports omitted details). Equal trees
            produce "Изменений нет: деревья идентичны.".'
        story_lines:
          type: array
          description: 'The same story line by line: a header with counts followed
            by one line per change; at most 20 detail lines, then an overflow line.
            Equal trees produce a single identical-trees line.'
          items:
            type: string
