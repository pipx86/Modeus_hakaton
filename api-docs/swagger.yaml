          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentMessage'
              example:
              - id: msg-conflict-1
                kind: conflict
                text: 'Конфликт title: побеждает interview (Собирать требования к
                  интеграции)'
                payload:
                  id: conflict-1
                  node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                  field: title
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
