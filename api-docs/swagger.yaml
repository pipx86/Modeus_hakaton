                  priority: 100
                winner:
                  source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                  source_type: interview
                  value: Собирать требования к интеграции
                  priority: 300
                reason: 'higher source priority wins: interview (300)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /runs/{id}/agent-messages:
    get:
      tags:
      - runs
      summary: Synthesizer agent-memory messages for a run
      description: Returns agent-memory messages emitted by the deterministic synthesizer
        during finalization. Messages of kind `conflict` carry the resolved conflict
        object in `payload`. The list is empty when the run has no stored messages.
      operationId: getRunAgentMessages
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
