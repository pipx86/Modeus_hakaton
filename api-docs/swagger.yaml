          type: string
        source_id:
          type: string
          minLength: 1
        source_type:
          $ref: '#/components/schemas/SourceType'
        priority:
          type: integer
        ref_id:
          type: string
        status:
          $ref: '#/components/schemas/EvidenceStatus'
    NodeExplanation:
      type: object
      description: Template-only "why this node" explanation; summary is never empty.
      required:
      - summary
      - evidence
      additionalProperties: false
      properties:
        summary:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ExplanationEvidence'
    TreeResponse:
      type: object
      description: JSON body of GET /runs/{id}/tree; nodes plus the same deterministic
        insights as GET /runs/{id}/insights.
      required:
      - nodes
      - insights
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        insights:
          $ref: '#/components/schemas/Insights'
    Insights:
      type: object
      description: JSON body of GET /runs/{id}/insights; all collections are non-null.
      required:
      - run_id
      - provenance
      - health
      - flags
      - market_heat
      - coverage
      - sources
      - node_explanations
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        provenance:
          $ref: '#/components/schemas/InsightsProvenance'
        health:
          $ref: '#/components/schemas/InsightsHealth'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/InsightFlag'
        market_heat:
          $ref: '#/components/schemas/MarketHeat'
        coverage:
          $ref: '#/components/schemas/Coverage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/InsightSource'
        node_explanations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NodeExplanation'
    CoverageResponse:
      type: object
      description: JSON body of GET /runs/{id}/coverage (default format).
      required:
      - run_id
      - columns
      - rows
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        columns:
          type: array
          items:
            type: string
            enum:
            - interview
            - standard
            - vacancy
            - document
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CoverageRow'
    RunCompareMatch:
      type: object
      description: Node-matching counters of a run-to-run comparison.
      required:
      - by_id
      - by_title
      - unmatched
      additionalProperties: false
      properties:
        by_id:
          type: integer
          minimum: 0
          description: Number of pairs matched by node id.
        by_title:
          type: integer
          minimum: 0
          description: Number of pairs matched semantically by type, normalized title
            and ancestor path.
        unmatched:
          type: integer
          minimum: 0
          description: Number of nodes that could not be matched (equals added + removed).
    RunCompare:
      type: object
      description: JSON body of GET /runs/{id}/compare?against={other_run_id}.
      required:
      - run_id
      - against_run_id
      - profession
      - same_profession
      - match
      - added
      - removed
      - changed
      - summary
      - story
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        against_run_id:
          type: string
          minLength: 1
        profession:
          type: string
        same_profession:
          type: boolean
          description: True when the profession matches after normalization either
            by runs.profession or by the normalized title of the root role node of
            both trees.
        match:
          $ref: '#/components/schemas/RunCompareMatch'
        added:
          type: array
          description: Nodes that exist only in the head run, sorted by id.
          items:
            $ref: '#/components/schemas/Node'
        removed:
          type: array
          description: Nodes that exist only in the base run, sorted by id.
          items:
            $ref: '#/components/schemas/Node'
        changed:
          type: array
          description: Nodes matched between the runs whose fields changed, sorted
            by id.
          items:
            $ref: '#/components/schemas/SnapshotNodeChange'
        summary:
          $ref: '#/components/schemas/SnapshotDiffSummary'
        story:
          type: string
          description: Deterministic one-line human-readable description of the diff
            in Russian; its counts always agree with summary.
    ReviewProgress:
      type: object
      description: JSON body of GET /reviews/evidence/progress.
      required:
      - scope
      - pending
      - approved
      - rejected
      - total
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
          - global
          - run
          description: global for counters across all runs; run for a run-scoped counter.
        run_id:
          type: string
          description: Present only when scope is run.
        pending:
          type: integer
          minimum: 0
        approved:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Always equals pending + approved + rejected.
    ZunSuggestion:
      type: object
      description: One rule-based ZUN suggestion for a tree node.
      required:
      - node_id
      - node_title
      - knowledge
      - skills
      - abilities
      - source
      - current_zun
      - can_apply
      additionalProperties: false
      properties:
        node_id:
          type: string
          minLength: 1
        node_title:
          type: string
        knowledge:
          type: array
          description: Suggested knowledge items; empty when the node already has
            a ZUN.
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        abilities:
          type: array
          items:
            type: string
        source:
          type: string
          enum:
          - rule
          description: Always rule; ZUN suggestions never come from an LLM.
        current_zun:
          $ref: '#/components/schemas/Zun'
        can_apply:
          type: boolean
          description: True only when the node has no ZUN and the suggestion is non-empty.
    ZunRejectRequest:
      type: object
      description: Body of POST /runs/{id}/zun/suggestions/reject.
      required:
      - node_id
      additionalProperties: false
      properties:
        node_id:
          type: string
          minLength: 1
    ZunRejectResponse:
      type: object
      description: Result of persisting a rejected ZUN suggestion.
      required:
      - run_id
      - node_id
      - rejected
      additionalProperties: false
      properties:
        run_id:
          type: string
        node_id:
          type: string
        rejected:
          type: boolean
    ZunApplyRequest:
      type: object
      description: Body of POST /runs/{id}/zun/suggestions/apply.
      required:
      - node_id
      additionalProperties: false
      properties:
        node_id:
          type: string
          minLength: 1
        knowledge:
          type: array
          description: Knowledge items; at least one non-empty item across all three
            lists is required.
          maxItems: 50
          items:
            type: string
            maxLength: 200
        skills:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
        abilities:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
    ZunApplyResponse:
      type: object
      description: Result of a successful ZUN apply (an updated, no-longer-applicable
        suggestion).
      required:
      - run_id
      - node_id
      - node_title
      - source
      - applied
      - can_apply
      - current_zun
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
        node_title:
          type: string
        source:
          type: string
          enum:
          - rule
        applied:
          type: boolean
        can_apply:
          type: boolean
          description: Always false after a successful apply.
        current_zun:
          $ref: '#/components/schemas/Zun'
    EvidenceContextItem:
      type: object
      description: Evidence plus the node/source titles needed by the review panel.
      required:
      - id
      - node_id
      - source_id
      - quote
      - status
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
        node_title:
          type: string
        source_id:
          type: string
          minLength: 1
        source_title:
          type: string
        source_url:
          type: string
        ref_id:
          type: string
        quote:
          type: string
        status:
          $ref: '#/components/schemas/EvidenceStatus'
    ChatTranscriptMessage:
      type: object
      description: One saved interview chat message; sequence is the 1-based position
        in the dialog.
      required:
      - id
      - role
      - content
      - sequence
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - user
          - agent
        content:
          type: string
        sequence:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    EvidenceTranscriptMatch:
      type: object
      nullable: true
      description: The chat message that best matches the evidence quote; null when
        nothing matches.
      required:
      - message_id
      - sequence
      - role
      - strategy
      - contains_quote
      - quote
      additionalProperties: false
      properties:
        message_id:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - user
          - agent
        strategy:
          type: string
          enum:
          - message_id
          - answer_index
          - question_index
          - sequence
          - quote
          - token_overlap
          description: 'Which matching rule selected the message: ref_id equals the
            message id; answer-N (Nth user reply); q-N (Nth interviewer question);
            msg-N/N (message sequence); quote text search; best lexical token overlap.'
        contains_quote:
          type: boolean
          description: True when the quote is contained in the message content.
        quote:
          type: string
        quote_start:
          type: integer
          minimum: 0
          description: Rune offset of the quote start in content; present only for
            verbatim (case-insensitive included) matches.
        quote_end:
          type: integer
          minimum: 0
          description: Rune offset of the quote end in content; present only for verbatim
            (case-insensitive included) matches.
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Lexical-overlap score (0..1); present for token_overlap matches.
    EvidenceContext:
      type: object
      description: JSON body of GET /runs/{id}/evidence/{evidence_id}/context.
      required:
      - run_id
      - evidence
      - messages
      - match
      - note
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        evidence:
          $ref: '#/components/schemas/EvidenceContextItem'
        messages:
          type: array
          description: Saved transcript ordered by sequence (at most 500 messages).
          items:
            $ref: '#/components/schemas/ChatTranscriptMessage'
        match:
          $ref: '#/components/schemas/EvidenceTranscriptMatch'
        note:
          type: string
          description: Human-readable explanation of the chosen match strategy (or
            why nothing matched).
