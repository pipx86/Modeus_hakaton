openapi: 3.0.3
info:
  title: Modeus activity-descriptor API
  version: 0.1.0
  description: Contract for the multi-agent activity-descriptor backend (cards 1,
    18, 19, 20). This file is the source of truth; the copies served by the API from
    `api-docs/` (`swagger.json` and `swagger.yaml`, shown at `/swagger/`) are generated
    from it. All endpoints are relative to the `/api/v1` server and, except for `GET
    /health`, require a JWT bearer token. Successful responses are JSON, except the
    run export which serves Markdown by default (`?format=md`) and JSON on request
    (`?format=json`); run progress is streamed by `GET /runs/{id}/events` as `text/event-stream`.
    Error responses carry a stable machine-readable `code` and a human-readable `message`.
servers:
- url: /api/v1
  description: API prefix used by cmd/api and cmd/server.
tags:
- name: system
  description: Liveness probe.
- name: sources
  description: Source documents (vacancies, interviews, standards) and their searchable
    fragments.
- name: evidences
  description: Evidence quotes attached to tree nodes and their expert approval or
    rejection state.
- name: reviews
  description: Expert review queue of disputed evidence (pending and rejected quotes).
- name: runs
  description: Research runs, saved activity trees, answers, snapshots, snapshot diffs,
    export and search.
- name: nodes
  description: Editing of individual activity-tree nodes.
- name: chat
  description: Interview chat messages of a run.
- name: users
  description: Demo users and their roles.
security:
- bearerAuth: []
paths:
  /ingest:
    post:
      tags:
      - sources
      summary: Запустить импорт настроенных файлов
      description: Требуется роль admin. Имена файлов задаются на сервере.
      operationId: ingestConfiguredFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sources
              properties:
                sources:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    enum:
                    - vacancies
                    - standards
      responses:
        '200':
          description: Число вставленных и обновлённых записей.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - ingested
                - vacancies
                - standards
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  ingested:
                    type: integer
                    minimum: 0
                  vacancies:
                    type: integer
                    minimum: 0
                  standards:
                    type: integer
                    minimum: 0
        '400':
          description: Некорректный список источников
        '401':
          description: Нужен JWT
        '403':
          description: Недостаточно прав
        '500':
          description: Сбой загрузки настроенных файлов
        '503':
          description: Файлы или PostgreSQL не настроены
  /health:
    get:
      tags:
      - system
      summary: Service liveness probe
      description: Public endpoint; no bearer token is required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /sources:
    get:
      tags:
      - sources
      summary: List sources
      description: Returns sources ordered by creation time, newest first (at most
        1000).
      operationId: listSources
      responses:
        '200':
          description: Array of sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags:
      - sources
      summary: Create a source
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - title
              additionalProperties: false
              properties:
                type:
                  $ref: '#/components/schemas/SourceType'
                title:
                  type: string
                  minLength: 1
                content:
                  type: string
                source_url:
                  type: string
            example:
              type: interview
              title: Интервью с ведущим аналитиком
              content: Транскрипт интервью о ежедневных задачах аналитика.
      responses:
        '201':
          description: Created source (server-assigned id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /sources/upload:
    post:
      tags:
      - sources
      summary: Upload a document as a source
      description: Extracts text from PDF, DOCX, TXT, MD, CSV or JSON and stores it
        as a global source that the analyst can use in new runs. The title defaults
        to the file name; the type defaults to `document`.
      operationId: uploadSource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: Document to extract text from (max 20 MB).
                title:
                  type: string
                  description: Optional display title; defaults to the file name.
                type:
                  $ref: '#/components/schemas/SourceType'
      responses:
        '201':
          description: Created source with extracted text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File is larger than 20 MB.
        '500':
          $ref: '#/components/responses/InternalError'
  /sources/{id}:
    get:
      tags:
      - sources
      summary: Get one source
      operationId: getSource
      parameters:
      - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags:
      - sources
      summary: Delete a source
      description: A source is deleted only when no evidence references it; otherwise
        the server returns 409.
      operationId: deleteSource
      parameters:
      - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: Deleted, no content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The source is referenced by evidence and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SOURCE_IN_USE
                message: source is referenced by evidence
        '500':
          $ref: '#/components/responses/InternalError'
  /sources/{id}/index:
    post:
      tags:
      - sources
      summary: Build source fragments and their vectors
      operationId: indexSourceFragments
      parameters:
      - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: Index stored.
        '400':
          description: The path id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: expected UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          description: The source or the embedding model is unavailable; the previous
            index is kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INDEX_FAILED
                message: unable to obtain vectors; previous index kept
  /evidences:
    get:
      tags:
      - evidences
      summary: List evidences
      description: Optionally filtered by node_id and/or source_id; at most 1000 rows.
      operationId: listEvidences
      parameters:
      - name: node_id
        in: query
        required: false
        description: Only evidence attached to this node (UUID).
        schema:
          type: string
      - name: source_id
        in: query
        required: false
        description: Only evidence quoting this source (UUID).
        schema:
          type: string
      responses:
        '200':
          description: Array of evidences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableTree'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags:
      - evidences
      summary: Attach an evidence to a node
      operationId: createEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - node_id
              - source_id
              - quote
              additionalProperties: false
              properties:
                node_id:
                  type: string
                  format: uuid
                source_id:
                  type: string
                  format: uuid
                ref_id:
                  type: string
                  minLength: 1
                quote:
                  type: string
                  minLength: 1
            example:
              node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
              source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
              ref_id: frag-12
              quote: Каждую неделю я собираю требования у заказчика.
      responses:
        '201':
          description: Created evidence (server-assigned id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableTree'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /evidences/{id}:
    get:
      tags:
      - evidences
      summary: Get one evidence
      description: Returns the evidence with the legacy `approved` flag in addition
        to `status`.
      operationId: getEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidence details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      tags:
      - evidences
      summary: Edit an evidence quote
      description: Replaces the quote text while keeping the evidence status and node
        link.
      operationId: updateEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quote
              additionalProperties: false
              properties:
                quote:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Updated evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /evidences/{id}/approve:
    post:
      tags:
      - evidences
      summary: Approve an evidence
      description: Confirmation status is stored server-side; no body is returned.
        Only pending evidence can be approved.
      operationId: approveEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '204':
          description: Approved, no content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evidence is already approved or already rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyApproved:
                  summary: Already approved
                  value:
                    code: ALREADY_APPROVED
                    message: evidence already approved
                alreadyRejected:
                  summary: Already rejected
                  value:
                    code: ALREADY_REJECTED
                    message: evidence already rejected
        '500':
          $ref: '#/components/responses/InternalError'
  /evidences/{id}/reject:
    post:
      tags:
      - evidences
      summary: Reject an evidence
      description: Marks a quote as rejected; only pending evidence can be rejected.
        Rejected evidence appears in the expert review queue with `status=rejected`
        (`GET /reviews/evidence`), where an expert can then approve it.
      operationId: rejectEvidence
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '204':
          description: Rejected, no content.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evidence is already rejected or already approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyRejected:
                  summary: Already rejected
                  value:
                    code: ALREADY_REJECTED
                    message: evidence already rejected
                alreadyApproved:
                  summary: Already approved
                  value:
                    code: ALREADY_APPROVED
                    message: evidence already approved
        '500':
          $ref: '#/components/responses/InternalError'
  /evidences/bulk-approve:
    post:
      tags:
      - evidences
      summary: Bulk approve evidences
      description: Approves several quotes at once; ids that are missing or not pending
        are counted as skipped.
      operationId: bulkApproveEvidences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveRequest'
            example:
              ids:
              - 8b1a2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
              - 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
      responses:
        '200':
          description: Counts of approved and skipped evidences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApproveResponse'
              example:
                approved: 2
                skipped: 0
        '400':
          description: Invalid JSON body or an empty ids array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: ids array is required and must not be empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /reviews/evidence:
    get:
      tags:
      - reviews
      summary: Expert review queue for disputed evidence
      description: 'Returns evidence that still needs expert review: `status=pending`
        (default) or `status=rejected`. Approved evidence is intentionally never returned.
        Each row carries run_id, node_id/node_title, source_id/source_title/source_url,
        ref_id and the quote so an expert can decide without extra lookups. The order
        is stable (`created_at`, then `id`), so pagination with `limit` (1..200, default
        50) and `offset` (>= 0, default 0) is deterministic. An empty page is `[]`,
        never `null`. Only the expert roles admin and admin may call this operation;
        user and user receive 403.'
      operationId: listReviewQueue
      parameters:
      - name: status
        in: query
        required: false
        description: Review state to list. Any value other than pending or rejected
          is a 400.
        schema:
          type: string
          enum:
          - pending
          - rejected
          default: pending
      - name: limit
        in: query
        required: false
        description: Page size, 1..200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Number of rows to skip, >= 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: One page of the review queue; an empty page is [].
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewQueueItem'
              examples:
                pendingPage:
                  summary: One pending evidence row
                  value:
                  - id: 8b1a2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                    node_id: 5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c
                    node_title: Проводить интервью с заказчиком
                    source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                    source_title: Интервью с ведущим аналитиком
                    source_url: https://example.com/interviews/42
                    ref_id: frag-12
                    quote: Каждую неделю я собираю требования у заказчика.
                    status: pending
        '400':
          description: status, limit or offset is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidStatus:
                  summary: Unsupported status value
                  value:
                    code: BAD_REQUEST
                    message: status must be pending or rejected
                invalidLimit:
                  summary: Limit out of range
                  value:
                    code: BAD_REQUEST
                    message: limit must be an integer between 1 and 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /reviews/evidence/progress:
    get:
      tags:
      - reviews
      summary: Evidence review progress counters
      description: Returns how many evidence rows are pending, approved and rejected.
        Without `run_id` the counters are global across all runs; with `run_id` they
        are scoped to that run. `total` always equals `pending + approved + rejected`.
        Status is read from `evidence.status` with legacy records treated as `pending`.
        Used by the review progress counter and the keyboard review mode; expert roles
        only.
      operationId: getReviewProgress
      parameters:
      - name: run_id
        in: query
        required: false
        description: Optional run UUID filter. A malformed UUID is a 400; a valid
          but unknown run id is a 404 (so the UI can tell a typo from an empty run).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Review counters for the requested scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewProgress'
              examples:
                global:
                  summary: Counters across all runs
                  value:
                    scope: global
                    pending: 7
                    approved: 12
                    rejected: 3
                    total: 22
                scopedToRun:
                  summary: Counters for one run
                  value:
                    scope: run
                    run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                    pending: 2
                    approved: 5
                    rejected: 1
                    total: 8
        '400':
          description: run_id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: run_id must be a UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The referenced run does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: run not found
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /dashboard/correlation:
    get:
      tags:
      - dashboard
      summary: Correlation matrix for completed runs
      description: Deterministic Pearson correlation between run duration, tree structure
        and evidence volume across completed runs. Available to admin and user.
      operationId: getDashboardCorrelation
      responses:
        '200':
          description: Correlation matrix and the number of runs used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
  /dashboard/skills:
    get:
      tags:
      - dashboard
      summary: Co-occurrence graph of tree competencies
      description: Deterministic graph of function/task/action titles that appear
        together in completed run trees. Available to admin and user.
      operationId: getDashboardSkills
      responses:
        '200':
          description: Competency graph and the number of runs used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillGraphResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
  /runs:
    get:
      tags:
      - runs
      summary: List research runs
      operationId: listRuns
      responses:
        '200':
          description: Array of runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags:
      - runs
      summary: Start a run
      description: Starts an analysis run for the given profession. When the chat
        interviewer is configured, the run is created in the interview stage and the
        interviewer starts immediately; otherwise the batch pipeline is triggered
        for the PostgreSQL store.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - profession
              additionalProperties: false
              properties:
                profession:
                  type: string
                  minLength: 1
                type:
                  type: string
                  enum:
                  - chat
                  - batch
                  description: chat starts the interactive interviewer; batch runs
                    the domain.Orchestrate pipeline. Omitted means chat when the chat
                    service is configured, otherwise batch.
                transcript:
                  type: string
                  description: Optional interview transcript for a batch run. Chat
                    runs ignore it.
            example:
              profession: Аналитик данных
              type: batch
      responses:
        '201':
          description: Created run (status pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
