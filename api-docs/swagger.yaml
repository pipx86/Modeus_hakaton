              content: Провожу интервью с заказчиком и фиксирую требования.
      responses:
        '201':
          description: Created user message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Invalid JSON body or empty content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: content is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The run has no chat session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: chat session not found
        '409':
          description: The chat session does not accept this message (for example
            it is already finished).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CHAT_CONFLICT
                message: chat session is closed
        '503':
          description: The chat service is not configured on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CHAT_DISABLED
                message: chat is not configured
  /runs/{id}/conflicts:
    get:
      tags:
      - runs
      summary: Resolved synthesizer conflicts for a run
      description: Returns title/description conflicts detected and deterministically
        resolved by the synthesizer during finalization. Every conflict keeps the
        competing values and the winner (interview > standard > vacancy > document).
        Admin only. The list is empty when the run has no stored conflicts.
      operationId: getRunConflicts
      parameters:
      - $ref: '#/components/parameters/RunId'
