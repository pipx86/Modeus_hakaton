  /runs/{id}/compare:
    get:
      tags:
      - runs
      summary: Compare two research runs
      description: Compares the current saved trees of two research runs of the same
        profession. The path run `{id}` is the head (newer) side and `against` is
        the base, so `added` contains nodes only in the head and `removed` nodes only
        in the base. Nodes are matched first by node id (as in the snapshot diff)
        and then semantically by type + normalized title + normalized ancestor-title
        path; only unambiguous semantic pairs are matched and the rest stay added/removed
        (`match.unmatched` equals added + removed). `changed` lists the changed fields
        in the fixed order `title`, `description`, `type`, `parent_id`, `evidence`;
        for semantic pairs evidence is compared without the run-specific UUIDs (`ref_id`/`quote`/`status`)
        and `parent_id` by the normalized ancestor path. Both runs must have a saved
        tree; the run status does not block the comparison. `story` is a deterministic
        Russian human-readable summary that always agrees with `summary`. Read-only.
        user may read.
      operationId: compareRuns
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: against
        in: query
        required: true
        description: Base run id; must be a UUID and must differ from the path run
          id. The path run is the head of the comparison.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Run-to-run tree diff with match counters and a story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCompare'
              example:
                run_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                against_run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                profession: Аналитик данных
                same_profession: true
                match:
                  by_id: 0
                  by_title: 2
                  unmatched: 2
                added:
                - id: 7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c
                  type: action
                  title: Собирать требования еженедельно
                  parent_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                  evidence:
                  - id: e1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    node_id: 7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c
                    source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                    ref_id: frag-12
                    quote: Каждую неделю я собираю требования у заказчика.
                    status: pending
                removed:
                - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  type: task
                  title: Готовить отчёты
                  evidence:
                  - id: b2c3d4e5-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    node_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    source_id: 8a7b6c5d-4e3f-4a2b-8c1d-0e9f8a7b6c5d
                    ref_id: frag-7
                    quote: Готовлю еженедельные отчёты для руководителя.
                    status: approved
                changed:
                - id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                  before:
                    id: 3a4b5c6d-7e8f-4a9b-8c1d-2e3f4a5b6c7d
                    type: task
                    title: Собирать требования
                    evidence:
                    - id: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      node_id: 3a4b5c6d-7e8f-4a9b-8c1d-2e3f4a5b6c7d
                      source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                      ref_id: frag-7
                      quote: Собираю требования у заказчика.
                      status: approved
                  after:
                    id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                    type: task
                    title: Собирать требования к интеграции
                    evidence:
                    - id: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                      source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                      ref_id: frag-7
                      quote: Собираю требования у заказчика.
                      status: approved
                  fields:
                  - title
                summary:
                  added: 1
                  removed: 1
                  changed: 1
                story: 'Узлов добавлено: 1, удалено: 1, изменено: 1. Добавлен узел
                  «Собирать требования еженедельно». Удалён узел «Готовить отчёты».
                  Изменён узел «Собирать требования к интеграции»: название.'
        '400':
          description: against is missing, is not a UUID, or equals the path run id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingAgainst:
                  summary: Missing base run
                  value:
                    code: BAD_REQUEST
                    message: against parameter is required
                invalidAgainst:
                  summary: Base run is not a UUID
                  value:
                    code: BAD_REQUEST
                    message: against must be a run UUID
                sameRun:
                  summary: Base run equals the head run
                  value:
                    code: BAD_REQUEST
                    message: against must differ from id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: One of the runs does not exist (including an invalid UUID in
            the path).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: run not found
        '409':
          description: The runs have different professions or one run has no saved
            tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                professionMismatch:
                  summary: Different professions
                  value:
                    code: RUN_PROFESSION_MISMATCH
                    message: runs have different professions
                treeMissing:
                  summary: One run has no saved tree
                  value:
                    code: RUN_TREE_MISSING
                    message: one of the runs has no saved tree
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /runs/{id}/zun/suggestions:
    get:
      tags:
      - runs
      summary: Rule-based ZUN suggestions for a run tree
      description: 'Returns deterministic, rule-based knowledge/skills/abilities suggestions
        for every node of the run tree, in tree order. No LLM is used: `source` is
        always `rule`. A node with a non-empty ZUN keeps it untouched — its suggestion
        lists are empty and `can_apply` is false — while a node without a ZUN always
        gets a non-empty fallback suggestion for the node type and profession. Expert
        roles only.'
      operationId: listZunSuggestions
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: One suggestion per tree node; [] when the tree is empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZunSuggestion'
              example:
              - node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                node_title: Собирать требования
                knowledge:
                - SQL-запросы и реляционные базы данных
                - PostgreSQL
                skills:
                - Анализировать данные и требования
                abilities:
                - Ответственность за результат
                source: rule
                current_zun: null
                can_apply: true
              - node_id: 7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c
                node_title: Собирать требования еженедельно
                knowledge: []
                skills: []
                abilities: []
                source: rule
                current_zun:
                  knowledge:
                  - SQL-запросы и реляционные базы данных
                  skills:
                  - Анализировать данные и требования
                  abilities:
                  - Ответственность за результат
                can_apply: false
        '400':
          description: The run id is empty (only possible when the handler is called
            outside the router).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: run id is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{id}/zun/suggestions/apply:
    post:
      tags:
      - runs
      summary: Apply a rule-based ZUN suggestion to one node
      description: 'Persists knowledge/skills/abilities to one node of the run tree,
        but only when the node has no ZUN yet. An existing manual or auto-generated
        ZUN is never overwritten: the request fails with 409 `ZUN_ALREADY_SET` (the
        caller should re-read suggestions). Items are normalized: trimmed, inner spaces
        collapsed, empty items dropped, case-insensitive dedupe, at most 200 characters
        per item and 50 items per list. At least one non-empty item across the three
        lists is required and `node_id` is mandatory. The node must belong to the
        run (404 otherwise). Expert roles only.'
      operationId: applyZunSuggestion
      parameters:
      - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZunApplyRequest'
            example:
              node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
              knowledge:
              - SQL-запросы и реляционные базы данных
              - PostgreSQL
              skills:
              - Анализировать данные и требования
              abilities:
              - Ответственность за результат
      responses:
        '200':
          description: ZUN saved for the node; the returned suggestion is no longer
            applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZunApplyResponse'
              example:
                run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                node_title: Собирать требования
                source: rule
                applied: true
                can_apply: false
                current_zun:
                  knowledge:
                  - SQL-запросы и реляционные базы данных
                  - PostgreSQL
                  skills:
                  - Анализировать данные и требования
                  abilities:
                  - Ответственность за результат
        '400':
          description: Malformed JSON, unknown fields, trailing data, a missing node_id,
            an empty ZUN payload, or a list/item over the documented limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emptyPayload:
                  summary: No ZUN items supplied
                  value:
                    code: BAD_REQUEST
                    message: at least one ZUN item is required
                itemTooLong:
                  summary: One item exceeds the length limit
                  value:
                    code: BAD_REQUEST
                    message: ZUN item is longer than 200 characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The run does not exist or the node does not belong to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: run or node not found
        '409':
          description: The node already has a non-empty ZUN; suggestions never overwrite
            it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ZUN_ALREADY_SET
                message: node already has ZUN; automatic suggestion does not overwrite
                  it
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/zun/suggestions/reject:
    post:
      tags:
      - runs
      summary: Persistently reject one rule-based ZUN suggestion
      description: Remembers that the expert rejected the suggestion for one node
        of the run tree. Later GET requests omit that node until the rejection is
        removed from the database; the tree and any existing ZUN are untouched. Repeated
        rejection is idempotent. Expert roles only.
      operationId: rejectZunSuggestion
      parameters:
      - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZunRejectRequest'
            example:
              node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
      responses:
        '200':
          description: Rejection saved; the suggestion will no longer be listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZunRejectResponse'
              example:
                run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                rejected: true
        '400':
          description: Malformed JSON, unknown fields, trailing data or a missing
            node_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The run does not exist or the node does not belong to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/evidence/{evidence_id}/context:
    get:
      tags:
      - evidences
      summary: Evidence context in the interview transcript
      description: 'Returns the evidence item (quote, ref_id, node and source titles)
        plus the full saved interview transcript of the run and the message that best
        matches the quote, so the UI can scroll to and highlight it after a reload.
        Matching is deterministic in this order: message id, `answer-N`/`a-N`/`ответ-N`
        (Nth user reply), `q-N`/`question-N`/`вопрос-N` (Nth interviewer question),
        `msg-N`/`N` (message sequence), exact quote text, then the best lexical token
        overlap. `match` is null and `note` explains why when no message matches.
        `quote_start` and `quote_end` are rune offsets in the message `content` only
        when the quote is found verbatim (case-insensitive text search included);
        the lexical fallback has no offsets. `messages` is ordered by sequence (at
        most 500). Available to every authenticated role. The in-memory demo store
        serves the evidence with an empty transcript unless the live chat service
        still holds the dialog.'
      operationId: getEvidenceContext
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/EvidenceContextId'
      responses:
        '200':
          description: Evidence item, saved transcript and the best matching message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceContext'
              example:
                run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                evidence:
                  id: e1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                  node_title: Собирать требования
                  source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                  source_title: Интервью с ведущим аналитиком
                  source_url: https://example.com/interviews/42
                  ref_id: answer-2
                  quote: Каждую неделю я собираю требования у заказчика.
                  status: pending
                messages:
                - id: msg-4d7d3a8e-1
                  role: agent
                  content: Расскажите, как вы собираете требования?
                  sequence: 1
                  created_at: '2026-11-18T10:00:05Z'
                - id: msg-4d7d3a8e-2
                  role: user
                  content: Каждую неделю я собираю требования у заказчика.
                  sequence: 2
                  created_at: '2026-11-18T10:01:00Z'
                match:
                  message_id: msg-4d7d3a8e-2
                  sequence: 2
                  role: user
                  strategy: answer_index
                  contains_quote: true
                  quote: Каждую неделю я собираю требования у заказчика.
                  quote_start: 0
                  quote_end: 47
                note: 'ref_id указывает на номер ответа (answer-N): выбрана N-я реплика
                  пользователя'
        '400':
          description: The run id or evidence id is empty (only possible outside the
            router).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: run and evidence ids are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The evidence does not exist inside the run (evidence of another
            run is indistinguishable from a missing one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: evidence not found
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /runs/{id}/export:
    get:
      tags:
      - runs
      summary: Export a completed run as Markdown, JSON or CSV
      description: 'Exports the finalized activity tree of a run whose status is `done`.
        Without `format` the endpoint returns the legacy bare JSON array of tree nodes.
        Explicit `format=json` returns a structured run export document; `format=md`
        returns a human-readable Markdown report with the profession, status, run
        id, role → function → task → action hierarchy, evidence quotes (source_id/ref_id/status),
        resolved conflicts, the final recommendations/courses chat message when available
        and the generation timestamp. `format=json` returns the same data as a structured
        document (`schema=run-export/v1`). Roles: admin, user. CSV returns one row
        per evidence quote or per node without evidence. Conflicts and source metadata
        are auxiliary and are read best-effort: if they cannot be loaded the export
        still succeeds without them. The response is served with `Content-Disposition:
        attachment` and a filename built from a sanitized run id.'
      operationId: exportRun
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: format
        in: query
        required: false
        description: 'Export format: `md`, `json`, `csv`, or omitted for the legacy
          bare node array. Any other value returns 400 BAD_REQUEST. Case and surrounding
          whitespace are normalized.'
        schema:
          type: string
          enum:
          - md
          - json
          - csv
          default: json
      responses:
        '200':
          description: Legacy bare node array by default; CSV, structured JSON or
            Markdown when requested.
          headers:
            Content-Disposition:
              description: '`attachment; filename="run-<sanitized-id>.md"`, `.json`
                or `.csv`; the id is reduced to ASCII letters, digits, `-` and `_`.'
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
              example: "# Run export: Аналитик данных\n\n- Run ID: `run-export-1`\n\
                - Status: done\n- Generated at: 2026-11-18T10:12:00Z\n\n## Competency\
                \ tree\n\n- Аналитик данных (role) `node-role`\n  - Аналитика требований\
                \ (function) `node-function`\n\n## Evidence\n\n| Node | Quote | Source\
                \ | Ref ID | Status |\n| --- | --- | --- | --- | --- |\n| `node-function`\
                \ — Аналитика требований | Цитата про анализ требований | `src-interview`\
                \ (interview) | `ref-function` | approved |\n\n## Conflicts\n\nNo\
                \ source conflicts were resolved for this run.\n"
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRun'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run is not finished (`RUN_NOT_FINISHED`) or is finished
            but has no saved tree (`RUN_HAS_NO_TREE`); there is nothing to export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                runNotFinished:
                  summary: Run is not done yet
                  value:
                    code: RUN_NOT_FINISHED
                    message: run is not finished yet
                runHasNoTree:
                  summary: Finished run without a saved tree
                  value:
                    code: RUN_HAS_NO_TREE
                    message: run has no saved tree yet
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /runs/{id}/events:
    get:
      tags:
      - runs
      summary: Stream run progress (SSE)
      description: '`text/event-stream`. Pipeline events are `stage_change`, `error`
        and `done` with `data` containing `stage`, `status`, `pct` and, when applicable,
        `message`. Chat runs additionally emit `agent_thinking`, `agent_message` and
        `run_status` events. Heartbeats are sent as `event: heartbeat`. The client
        may reconnect with `Last-Event-ID`; previously delivered events are skipped,
        and the stream closes when the run reaches done or failed.'
      operationId: streamRunEvents
      parameters:
      - $ref: '#/components/parameters/RunId'
      - name: Last-Event-ID
        in: header
        required: false
        description: ID of the last received event; the server resumes after it without
          duplicates.
        schema:
          type: string
      responses:
        '200':
          description: Server-sent events stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{id}/messages:
    get:
      tags:
      - chat
      summary: List chat messages of a run
      description: Returns the interview chat history, oldest first. Available while
        the chat service is configured.
      operationId: listMessages
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
