          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: chat session not found
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The chat service is not configured on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CHAT_DISABLED
                message: chat is not configured
    post:
      tags:
      - chat
      summary: Send a user message to the interviewer
      description: Records the respondent answer and schedules the next question.
        user role cannot post messages.
      operationId: sendMessage
