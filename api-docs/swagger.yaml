  /runs/{id}/insights:
    get:
      tags:
      - runs
      summary: Consolidated tree insights for a run
      description: One deterministic payload for the mentor insights. `provenance`
        gives per-node source count, source types in trust order and evidence count;
        `health` gives the 0..100 tree quality score with its groundedness/completeness/duplicates/orphans
        breakdown, the weights, the raw counts and the formula; `flags` lists red
        flags from the five fixed rules (`SUSPICIOUS_TITLE`, `DUPLICATE_TITLE`, `SINGLE_WEAK_SOURCE`,
        `NO_CHILDREN`, `NO_EVIDENCE`) with parallel `codes`/`reasons`; `market_heat`
        overlays skill frequencies on node text with source `run.skill_freq` when
        the run has skill frequencies, otherwise `vacancy_sources` (deterministic
        extraction from vacancy/standard source content, with `sample_size`) or `none`;
        `coverage` is the source-type matrix; `sources` is run-source metadata; `node_explanations`
        is template-only "why this node" text. All collections are non-null (`[]`/`{}`),
        no LLM or external calls are made. Requires PostgreSQL and linked run sources;
        the in-memory demo store returns 501.
      operationId: getRunInsights
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Consolidated insights payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insights'
              example:
                run_id: 4d7d3a8e-1b2c-4d5e-8f90-1a2b3c4d5e6f
                provenance:
                  nodes:
                    6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11:
                      source_count: 2
                      source_types:
                      - interview
                      - standard
                      evidence_count: 2
                    7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c:
                      source_count: 1
                      source_types:
                      - interview
                      evidence_count: 1
                health:
                  score: 85
                  breakdown:
                    groundedness: 100
                    completeness: 50
                    duplicates: 100
                    orphans: 100
                  weights:
                    groundedness: 0.4
                    completeness: 0.3
                    duplicates: 0.2
                    orphans: 0.1
                  counts:
                    node_count: 2
                    grounded_nodes: 2
                    duplicate_nodes: 0
                    orphan_nodes: 0
                    childless_nodes: 1
                  formula: 'score = round(0.40*groundedness + 0.30*completeness +
                    0.20*duplicates + 0.10*orphans). All components are 0..100 quality
                    scores where 100 is best: groundedness = share of nodes with at
                    least one evidence record; completeness = share of structurally
                    complete nodes (role/function/task nodes with at least one child,
                    action leaves are complete by design); duplicates = share of nodes
                    whose (type, normalized title) is unique; orphans = share of nodes
                    whose parent exists (roots have no parent by design). An empty
                    tree scores 0.'
                flags:
                - node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                  codes:
                  - NO_CHILDREN
                  reasons:
                  - У узла типа task нет дочерних узлов — уровень не раскрыт, добавьте
                    декомпозицию
                market_heat:
                  source: run.skill_freq
                  top:
                  - skill: SQL
                    frequency: 42
                  nodes:
                    6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11:
                      score: 42
                      matches:
                      - SQL
                coverage:
                  columns:
                  - interview
                  - standard
                  - vacancy
                  - document
                  rows:
                  - node_id: 6f1c5f2e-6c58-4a1b-9a9e-2f4f5c8f0a11
                    title: Собирать требования
                    type: task
                    cells:
                      interview: 1
                      standard: 1
                      vacancy: 0
                      document: 0
                sources:
                - id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                  type: interview
                  title: Интервью с ведущим аналитиком
