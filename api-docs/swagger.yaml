                    evidence:
                    - quote: Каждую неделю я собираю требования у заказчика.
                      source_id: 3b2d7c90-2f47-4d3b-a1c0-8e1f2d4c6b7a
                      source_type: interview
                      priority: 300
                      ref_id: frag-12
                      status: pending
                  7c6b5a49-3d2e-4f1a-8b9c-0d1e2f3a4b5c:
                    summary: 'Узел «Собирать требования еженедельно» (action) включён
                      в дерево по подтверждениям: цитат 1, источников 1, типы источников
                      interview; максимальный приоритет — interview (300).'
                    evidence:
