  /runs/estimate:
    get:
      tags:
      - runs
      summary: Estimate the next run (duration, tokens, cost)
      description: 'Read-only pre-run estimate built only from data already stored
        by this backend; no external provider is called. Duration is the median wall-clock
        time of completed runs of the same profession (matched case-insensitively
        and trimmed) and type, falling back to all completed runs of the type and
        then to documented constants. Tokens are the mean attributed LLM usage of
        the profession history, or a per-request mean from stored usage multiplied
        by the expected call count, or documented constants. Cost is `null` unless
        a recorded price or the `COST_ESTIMATE_USD_PER_1M_TOKENS` fallback price is
        available (never silently reported as zero). `confidence` is a three-state
        label: high with at least 10 duration and 10 token samples, medium with at
        least 3 of both, low otherwise or when a default-based input is used. `sample_size`
        is the number of completed runs behind the duration estimate; `method` names
        the inputs that were used.'
      operationId: getRunEstimate
      parameters:
      - name: profession
        in: query
        required: true
        description: Target profession.
        schema:
          type: string
          minLength: 1
      - name: type
        in: query
        required: true
        description: Run type the estimate is for.
        schema:
          $ref: '#/components/schemas/RunType'
      responses:
        '200':
          description: Pre-run estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEstimate'
              example:
                profession: Аналитик данных
                type: chat
                sample_size: 12
                estimated_tokens: 9800
                estimated_duration_seconds: 95
                estimated_cost_usd: 0.0123
                confidence: high
                method: profession_history
        '400':
          description: profession is missing/blank, or type is missing or not chat/batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingProfession:
                  summary: Missing or blank profession
                  value:
                    code: BAD_REQUEST
                    message: profession is required
                invalidType:
                  summary: Missing or unsupported run type
                  value:
                    code: BAD_REQUEST
                    message: type must be chat or batch
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The stored run history could not be read. The estimate is never
            silently replaced by defaults on a storage error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL
                message: failed to read run history
