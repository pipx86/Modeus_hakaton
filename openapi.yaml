openapi: 3.0.3
info:
  title: Modeus activity-descriptor API
  version: 0.1.0
  description: Contract for the multi-agent activity-descriptor backend (cards 1, 18, 19, 20).
servers:
  - url: /api/v1
tags:
  - name: system
  - name: sources
  - name: evidences
  - name: runs
  - name: nodes
security:
  - bearerAuth: []
paths:
  "/health":
    get:
      tags: [system]
      summary: Service liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  "/sources":
    get:
      tags: [sources]
      summary: List sources
      operationId: listSources
      responses:
        "200":
          description: Array of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [sources]
      summary: Create a source
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              additionalProperties: false
              properties:
                type:
                  $ref: "#/components/schemas/SourceType"
                title:
                  type: string
                  minLength: 1
                content:
                  type: string
                source_url:
                  type: string
      responses:
        "201":
          description: Created source (server-assigned id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/sources/{id}":
    get:
      tags: [sources]
      summary: Get one source
      operationId: getSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [sources]
      summary: Delete a source
      operationId: deleteSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted, no content
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/evidences":
    get:
      tags: [evidences]
      summary: List evidences (filter by node_id or source_id)
      operationId: listEvidences
      parameters:
        - name: node_id
          in: query
          required: false
          schema:
            type: string
        - name: source_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Array of evidences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [evidences]
      summary: Attach an evidence to a node
      operationId: createEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, source_id, quote]
              additionalProperties: false
              properties:
                node_id:
                  type: string
                  format: uuid
                source_id:
                  type: string
                  minLength: 1
                ref_id:
                  type: string
                  minLength: 1
                quote:
                  type: string
      responses:
        "201":
          description: Created evidence (server-assigned id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/evidences/{id}/approve":
    post:
      tags: [evidences]
      summary: Approve an evidence
      operationId: approveEvidence
      description: Confirmation status is stored server-side; no body returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Approved, no content
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Evidence already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs":
    get:
      tags: [runs]
      summary: List runs
      operationId: listRuns
      responses:
        "200":
          description: Array of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [runs]
      summary: Start a run (triggers agents)
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profession]
              additionalProperties: false
              properties:
                profession:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Created run (status pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs/{id}":
    get:
      tags: [runs]
      summary: Get run status
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs/{id}/tree":
    get:
      tags: [runs]
      summary: Get activity tree produced by a run
      operationId: getRunTree
      description: Flat array of nodes; client rebuilds hierarchy via parent_id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [runs]
      summary: Сохранить новое дерево одной транзакцией
      operationId: saveRunTree
      description: Требуется роль admin, teacher или rop. Существующее дерево не заменяется.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/Node"}
      responses:
        "204": {description: Дерево сохранено}
        "400": {description: Неверный JSON}
        "401": {description: Нужен JWT}
        "403": {description: Недостаточно прав}
        "404": {description: Исследование не найдено}
        "409": {description: Дерево уже существует}
        "422":
          description: Дерево нарушает правила
          content:
            application/json:
              schema:
                type: object
                required: [code, details]
                properties:
                  code: {type: string}
                  details: {type: string}
                  node_id: {type: string}
  "/runs/{id}/answers":
    get:
      tags: [runs]
      summary: List evidence answers collected by a run
      operationId: getRunAnswers
      description: Flat array of evidences gathered across the run's nodes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of evidences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs/{id}/export":
    get:
      tags: [runs]
      summary: Export run result (tree)
      operationId: exportRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exported nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Run not finished yet, nothing to export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs/{id}/events":
    get:
      tags: [runs]
      summary: Stream run progress (SSE)
      operationId: streamRunEvents
      description: text/event-stream; events per stage; heartbeat; reconnect via Last-Event-ID without duplicates; closes on done/failed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: ID of the last received event; server resumes after it without duplicates.
      responses:
        "200":
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/nodes/{id}":
    patch:
      tags: [nodes]
      summary: Edit a node (rename / move / describe)
      operationId: patchNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                type:
                  $ref: "#/components/schemas/NodeType"
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                parent_id:
                  type: string
                evidence:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/Evidence"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Run already finished, node locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed (e.g. EVIDENCE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/runs/{id}/search":
    get:
      tags: [runs]
      summary: Найти фрагменты в источниках исследования
      operationId: searchRunFragments
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 5}
        - name: strategy
          in: query
          schema: {type: string, enum: [vector, hybrid], default: vector}
      responses:
        "200":
          description: Режим vector или bm25 и список найденных фрагментов
          content:
            application/json:
              schema:
                type: object
                required: [mode, hits]
                properties:
                  mode: {type: string, enum: [vector, bm25, hybrid]}
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        ref_id: {type: string, format: uuid}
                        source_id: {type: string, format: uuid}
                        quote: {type: string}
                        score: {type: number}
        "400": {description: Неверный запрос или пакет поиска не применён}
        "401": {description: Нужен JWT}
        "403": {description: Недостаточно прав}
        "404": {description: Исследование не найдено}
        "501": {description: Хранилище не поддерживает поиск}
  "/sources/{id}/index":
    post:
      tags: [sources]
      summary: Создать фрагменты источника и их векторы
      operationId: indexSourceFragments
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Индекс сохранён}
        "400": {description: Неверный ID}
        "401": {description: Нужен JWT}
        "403": {description: Нужна роль admin или teacher}
        "501": {description: Хранилище не поддерживает индексирование}
        "502": {description: Источник или модель недоступны; прежний индекс сохранён}
  "/runs/{id}/snapshots":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [runs]
      summary: Создать снимок сохранённого дерева
      operationId: createSnapshot
      responses:
        "201":
          description: Снимок создан
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Snapshot"}
        "404": {description: Исследование не найдено}
        "409": {description: Дерево ещё не сохранено}
    get:
      tags: [runs]
      summary: Получить снимки исследования
      operationId: listSnapshots
      responses:
        "200":
          description: Снимки в порядке версий
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Snapshot"}
        "404": {description: Исследование не найдено}
  "/runs/{id}/snapshots/{snapshot_id}":
    get:
      tags: [runs]
      summary: Получить снимок исследования
      operationId: getSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: snapshot_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Сохранённый снимок
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Snapshot"}
        "404": {description: Снимок не найден}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Snapshot:
      type: object
      required: [id, run_id, version, tree, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        tree: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    NodeType:
      type: string
      enum: [role, function, task, action]
    SourceType:
      type: string
      enum: [vacancy, interview, standard, document]
    RunStatus:
      type: string
      enum: [pending, running, done, failed]
    Evidence:
      type: object
      required: [id, source_id, quote]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        ref_id:
          type: string
          minLength: 1
        quote:
          type: string
    Node:
      type: object
      required: [id, type, title, evidence]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/NodeType"
        title:
          type: string
          minLength: 1
        description:
          type: string
        parent_id:
          type: string
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Evidence"
    Source:
      type: object
      required: [id, type, title]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/SourceType"
        title:
          type: string
          minLength: 1
        content:
          type: string
        source_url:
          type: string
        created_at:
          type: string
          format: date-time
    Run:
      type: object
      required: [id, status, profession]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RunStatus"
        profession:
          type: string
          minLength: 1
        root_node_id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        stage:
          type: string
          enum: [created, interview, analysis, synthesis, review, done, failed]
