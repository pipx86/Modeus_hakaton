# Конфигурация golangci-lint версии 2.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
  settings:
    misspell:
      ignore-rules:
        - routeros
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        text: "should have a package comment"
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
